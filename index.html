<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitGuard AI - Setup</title>
    
    <style>
        body {
            background-color: #010915;
            margin: 0;
            padding: 16px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: sans-serif;
            color: #ffffff;
        }

        .camera-box {
            width: 100%;
            max-width: 1280px;
            aspect-ratio: 16 / 9;
            background-color: #031126;
            border: 2px solid #1e293b;
            border-radius: 16px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .info-text {
            position: absolute;
            top: 24px;
            left: 0; 
            right: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            z-index: 10;
        }

        .title {
            color: #AAFF00;
            font-weight: 900;
            letter-spacing: 2px;
            font-size: 20px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #64748b;
            font-size: 12px;
            font-family: monospace;
        }

        .target-frame {
            position: absolute;
            top: 75px; 
            left: 24px; 
            right: 24px; 
            bottom: 24px;
            border: 1px dashed rgba(170, 255, 0, 0.4);
            border-radius: 12px;
            pointer-events: none;
            z-index: 20;
        }

        .corner {
            position: absolute;
            width: 16px;
            height: 16px;
            border-color: #AAFF00;
            border-style: solid;
            border-width: 0;
            pointer-events: none;
            z-index: 20;
        }
        .top-left     { top: 16px; left: 16px; border-top-width: 2px; border-left-width: 2px; border-top-left-radius: 4px; }
        .top-right    { top: 16px; right: 16px; border-top-width: 2px; border-right-width: 2px; border-top-right-radius: 4px; }
        .bottom-left  { bottom: 16px; left: 16px; border-bottom-width: 2px; border-left-width: 2px; border-bottom-left-radius: 4px; }
        .bottom-right { bottom: 16px; right: 16px; border-bottom-width: 2px; border-right-width: 2px; border-bottom-right-radius: 4px; }

    </style>
</head>
<body>

    <div class="camera-box">
        

        <div class="info-text">
            <span class="title">FITGUARD AI</span>
            <span class="subtitle">READY FOR WEBCAM STREAM</span>
        </div>

        <div class="target-frame"></div>


        <div class="corner top-left"></div>
        <div class="corner top-right"></div>
        <div class="corner bottom-left"></div>
        <div class="corner bottom-right"></div>

    </div>

</body>
</html>
